<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tabel Kepegawaian SIMRS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f8f7f4;
      color: #3d3d3a;
      padding: 20px;
    }

    .group-label {
      font-size: 11px;
      font-weight: 600;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 14px 0 6px;
    }

    .group-label:first-child {
      margin-top: 0;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #c2c0b6;
      background: #fff;
      color: #73726c;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }

    .btn:hover {
      background: #f1efe8;
      color: #3d3d3a;
    }

    .btn.active {
      background: #e6f1fb;
      color: #185fa5;
      border-color: #185fa5;
    }

    .card {
      background: #fff;
      border: 1px solid #d3d1c7;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .tbl-name {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 2px;
    }

    .fhir {
      font-size: 12px;
      color: #888780;
      margin: 0;
    }

    .desc {
      font-size: 14px;
      color: #73726c;
      line-height: 1.6;
      margin: 0 0 16px;
    }

    .section {
      font-size: 11px;
      font-weight: 600;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 0 0 8px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
    }

    .field-pill {
      background: #f8f7f4;
      border: 1px solid #e5e4de;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
    }

    .fn {
      font-weight: 600;
      font-family: monospace;
      color: #3d3d3a;
    }

    .ft {
      color: #888780;
      font-size: 11px;
      margin-top: 2px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
    }

    .pk {
      background: #faeeda;
      color: #854f0b;
    }

    .fk {
      background: #e6f1fb;
      color: #185fa5;
    }

    .req {
      background: #eaf3de;
      color: #3b6d11;
    }

    .opt {
      background: #f1efe8;
      color: #73726c;
      border: 1px solid #d3d1c7;
    }

    .rels {
      font-size: 13px;
      color: #73726c;
      line-height: 2;
    }

    .rels span {
      color: #185fa5;
      font-family: monospace;
      font-size: 12px;
    }

    .seed {
      font-size: 13px;
      color: #73726c;
      line-height: 1.9;
    }

    .seed span {
      display: inline-block;
      background: #f8f7f4;
      border: 1px solid #e5e4de;
      border-radius: 6px;
      padding: 2px 8px;
      margin: 2px 4px 2px 0;
      font-family: monospace;
      font-size: 12px;
      color: #3d3d3a;
    }
  </style>
</head>
